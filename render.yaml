services:
  - type: web
    name: ayu-link
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # The demo runs on https://ayu-link2-1.onrender.com, configured by hand in
    # the Render dashboard rather than through this blueprint. Keep
    # AYU_CORS_ORIGIN on that service set to the same value as below, or the
    # Socket.IO handshake fails and live updates never arrive.
    #
    # The ESP32 firmware talks to that host over https; API_BASE at the top of
    # firmware/rfid_esp32/rfid_esp32.ino already points there.
    #
    # AYU_ENV=dev seeds the demo users, patients and CARD-1001 on first boot,
    # which is what the demo needs. It also means the seed passwords
    # (ayu12345) are live, so do not use this configuration with real data.
    #
    # SQLite on an ephemeral filesystem is wiped on every deploy: card UIDs
    # registered by hand disappear. Attach a disk or move to Postgres if the
    # demo needs to survive redeploys.
    envVars:
      - key: AYU_ENV
        value: dev
      # Socket.IO rejects handshakes whose Origin is not listed here, so the
      # deployed host must appear or live updates never connect.
      - key: AYU_CORS_ORIGIN
        value: https://ayu-link.onrender.com,https://ayu-link2-1.onrender.com,http://localhost:5173,http://127.0.0.1:5173
      - key: AYU_SECRET
        generateValue: true
      - key: AYU_DATABASE_URL
        value: sqlite:///./ayu.db
